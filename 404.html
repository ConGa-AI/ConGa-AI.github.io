<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConGaAI</title>
    <script>
      (function () {
        var path = location.pathname + location.search + location.hash;
        try {
          sessionStorage.setItem('pages-spa-redirect', path);
        } catch (error) {}
        var preview = location.pathname === '/preview' || location.pathname.indexOf('/preview/') === 0;
        location.replace(preview ? '/preview/' : '/');
      })();
    </script>
  </head>
  <body></body>
</html>
